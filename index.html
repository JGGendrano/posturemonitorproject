<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostureGuard · Sign in</title>
  <link rel="icon" type="image/png" href="assets/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-wrap">

    <aside class="auth-side">
      <div class="brand light">
        <img class="brand-logo" src="assets/logo-mark-white.png" alt="">
        <h1>PostureGuard</h1>
      </div>
      <div class="auth-pitch">
        <h2 class="pitch-title">Stay straight, feel great.</h2>
        <p>Your harness watches your posture and sitting time, nudges you with a gentle vibration, and keeps a record here so you can see your habits improve.</p>
      </div>
      <svg class="spine-art" viewBox="0 0 240 120" aria-hidden="true">
        <path d="M10 90 C 60 90, 70 30, 120 30 S 180 90, 230 90" class="spine-bad"/>
        <path d="M10 60 L 230 60" class="spine-good"/>
        <circle cx="230" cy="60" r="6" class="spine-dot"/>
      </svg>
    </aside>

    <main class="auth-main">
      <form class="auth-card" id="authForm" novalidate>
        <h2 class="auth-title" id="formTitle">Welcome back</h2>
        <p class="auth-sub" id="formSub">Sign in to see your posture data.</p>

        <label class="auth-field">
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label class="auth-field">
          <span>Password</span>
          <div class="pw-wrap">
            <input type="password" name="password" autocomplete="current-password" minlength="6" required>
            <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false" title="Show password">
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
        </label>
        <label class="auth-field" id="confirmField" hidden>
          <span>Confirm password</span>
          <div class="pw-wrap">
            <input type="password" name="confirm" autocomplete="new-password" minlength="6">
            <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false" title="Show password">
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
        </label>

        <div class="auth-row" id="forgotRow">
          <button type="button" class="link" id="forgotBtn">Forgot password?</button>
        </div>

        <p class="auth-msg" id="authMsg" role="alert"></p>

        <button class="btn block" type="submit" id="submitBtn">Sign in</button>

        <p class="auth-switch">
          <span id="switchText">New to PostureGuard?</span>
          <button type="button" class="link" id="switchBtn">Create an account</button>
        </p>
      </form>

      <a class="demo-link" href="dashboard.html?demo=1">Try the demo without signing in</a>
    </main>
  </div>

  <script src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/login.js"></script>
</body>
</html>
